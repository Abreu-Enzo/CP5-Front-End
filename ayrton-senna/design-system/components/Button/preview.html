<!-- @dsCard group="Ações" height=220 subtitle="Primário, outline, ghost sobre vermelho" -->
<div style="display:grid;gap:24px;padding:24px">
  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">
    <a class="sn-btn sn-btn--lg" href="#">Ver a carreira <span class="sn-arrow">→</span></a>
    <button class="sn-btn">Próximo capítulo <span class="sn-arrow">→</span></button>
    <button class="sn-btn sn-btn--outline">Linha do tempo</button>
    <button class="sn-btn" disabled>Indisponível</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--brand);padding:24px">
    <button class="sn-btn sn-btn--ghost">Assistir à volta <span class="sn-arrow">→</span></button>
    <span style="font:700 12px/16px var(--font-sans);letter-spacing:.32em;color:var(--on-brand)">GHOST · SOBRE BRAND</span>
  </div>
</div>
